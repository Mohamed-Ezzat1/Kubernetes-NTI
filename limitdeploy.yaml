apiVersion: apps/v1
kind: Deployment
metadata:
  name: beta
  namespace: finance
spec:
  replicas: 2
  selector:
    matchLabels:
      app: beta-app
  template:
    metadata:
      labels:
        app: beta-app
    spec:
      containers:
        - name: beta-container
          image: redis:latest
          resources:
            limits:
              memory: "2G"
              cpu: "1"
            requests:
              memory: "1G"
              cpu: "0.5"