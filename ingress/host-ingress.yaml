apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ingress-host
spec:
  ingressClassName: nginx
  rules:
  - host: blue.local
    http:
      paths:
      - path: / 
        pathType: Prefix
        backend:
          service:
            name: ingress-service-blue
            port:
              number: 80
  - host: green.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: ingress-service-green
            port:
              number: 80