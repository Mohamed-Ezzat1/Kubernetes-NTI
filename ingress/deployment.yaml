apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingress-deployment-blue
spec:
  replicas: 1
  selector:
    matchLabels:
      app: blue
  template:
    metadata:
      labels:
        app: blue
    spec:
      containers:
      - name: ingress-container
        image: hashicorp/http-echo
        ports:
        - containerPort: 5678
        args:
        - -text=I am BLUE
        - -listen=:5678
---
