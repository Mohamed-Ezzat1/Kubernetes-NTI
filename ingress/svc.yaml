apiVersion: v1
kind: Service
metadata:
  name: ingress-service-blue
spec:
  selector:
    app: blue
  ports:
    - protocol: TCP
      port: 80
      targetPort: 5678
---
apiVersion: v1
kind: Service
metadata:
  name: ingress-service-green
spec:
  selector:
    app: green
  ports:
    - protocol: TCP
      port: 80
      targetPort: 5678