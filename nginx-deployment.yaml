apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-deployment
spec:
  replicas: 3
  selector:
    matchLabels:
      app: nginx-app
      type: frontend
  template:
    metadata:
      labels:
        app: nginx-app
        type: frontend
    spec:
      containers:     
        - name: nginx
          image: nginx:latest