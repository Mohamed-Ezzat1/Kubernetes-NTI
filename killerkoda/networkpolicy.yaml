apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-same-namespace
  namespace: lab-other
spec:
  podSelector:
    matchLabels: 
      app: out-name-space
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: main-app
      namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: lab-other