apiVersion: apps/v1
kind: Deployment
metadata:
  name: in-name-space
  namespace: lab-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: in-name-space
  template:
    metadata:
      labels:
        app: in-name-space
    spec:
      containers:
      - name: webapp
        image: nginx:1.25-alpine
        ports:
        - containerPort: 80

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: out-name-space
  namespace: lab-other
spec:
  replicas: 2
  selector:
    matchLabels:
      app: out-name-space
  template:
    metadata:
      labels:
        app: out-name-space
    spec:
      containers:
      - name: webapp
        image: nginx:1.25-alpine
        ports:
        - containerPort: 80