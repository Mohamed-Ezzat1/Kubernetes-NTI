<!DOCTYPE html>
<html>
<head>
<title>Capstone Items App</title>
<style>
  body { font-family: sans-serif; max-width: 500px; margin: 40px auto; padding: 0 20px; }
  h1 { font-size: 20px; }
  input { padding: 8px; width: 70%; }
  button { padding: 8px 14px; }
  ul { list-style: none; padding: 0; }
  li { padding: 8px; border-bottom: 1px solid #ddd; display: flex; justify-content: space-between; }
  .del { color: #c00; cursor: pointer; background: none; border: none; }
  #status { font-size: 12px; color: #666; margin-top: 10px; }
</style>
</head>
<body>
  <h1>Items</h1>
  <input id="name" placeholder="item name" />
  <button onclick="addItem()">Add</button>
  <ul id="list"></ul>
  <div id="status">loading...</div>

<script>
// Empty string = same-origin. The Ingress routes /api to the backend Service,
// so the frontend never needs to know the backend's actual DNS name.
const API_BASE = "";

async function loadItems() {
  try {
    const res = await fetch(API_BASE + "/api/items");
    const items = await res.json();
    document.getElementById("list").innerHTML = items.map(i =>
      `<li>${i.name} <button class="del" onclick="delItem(${i.id})">delete</button></li>`
    ).join("");
    document.getElementById("status").textContent = `${items.length} item(s) loaded from the database`;
  } catch (e) {
    document.getElementById("status").textContent = "Could not reach backend: " + e;
  }
}

async function addItem() {
  const input = document.getElementById("name");
  const name = input.value.trim();
  if (!name) return;
  await fetch(API_BASE + "/api/items", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({name})
  });
  input.value = "";
  loadItems();
}

async function delItem(id) {
  await fetch(API_BASE + "/api/items/" + id, { method: "DELETE" });
  loadItems();
}

loadItems();
</script>
</body>
</html>
